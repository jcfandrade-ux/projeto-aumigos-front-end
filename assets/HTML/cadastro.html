<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>ONG Aumigos! | Cadastro</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cadastre-se como voluntário ou apoiador da ONG Aumigos!.">
  <link rel="stylesheet" href="../assets/css/estilo.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>
  <script>
    $(document).ready(function(){
      $('#cpf').mask('000.000.000-00');
      $('#telefone').mask('(00) 00000-0000');
      $('#cep').mask('00000-000');
    });
  </script>
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="index.html">Início</a></li>
        <li><a href="projetos.html">Projetos</a></li>
        <li><a href="cadastro.html">Cadastro</a></li>
      </ul>
    </nav>
    <img src="../images/logo-ong-aumigos.png" alt="Logo ONG Aumigos!" width="150">
    <h1>Formulário de Cadastro</h1>
  </header>
  <main>
     <img src="../images/cachorro-oculos.jpg" alt="Cachorro com óculos preenchendo formulário" width="300">
    <form>
      <fieldset>
        <legend>Dados Pessoais</legend>
        <label for="nome">Nome Completo*</label>
        <input type="text" id="nome" name="nome" required autocomplete="name">

        <label for="email">E-mail*</label>
        <input type="email" id="email" name="email" required autocomplete="email">

        <label for="cpf">CPF*</label>
        <input type="text" id="cpf" name="cpf" required pattern="\d{3}\.\d{3}\.\d{3}-\d{2}" autocomplete="off">

        <label for="telefone">Telefone*</label>
        <input type="text" id="telefone" name="telefone" required autocomplete="tel">

        <label for="data_nasc">Data de Nascimento*</label>
        <input type="date" id="data_nasc" name="data_nasc" required>
      </fieldset>
      <fieldset>
        <legend>Endereço</legend>
        <label for="endereco">Endereço*</label>
        <input type="text" id="endereco" name="endereco" required autocomplete="address-line1">

        <label for="cep">CEP*</label>
        <input type="text" id="cep" name="cep" required pattern="\d{5}-\d{3}" autocomplete="postal-code">

        <label for="cidade">Cidade*</label>
        <input type="text" id="cidade" name="cidade" required autocomplete="address-level2">

        <label for="estado">Estado*</label>
        <input type="text" id="estado" name="estado" required autocomplete="address-level1">
      </fieldset>
      <button type="submit">Enviar cadastro</button>
    </form>
  </main>
  <footer>
    <p>&copy; 2025 ONG Aumigos!</p>
  </footer>
</body>
</html>
